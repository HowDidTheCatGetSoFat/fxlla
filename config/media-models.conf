# Image model catalog for `fxlla media image`. Format:
#   alias | cli | base_model | steps | caps | note
#
# caps is what the CLI ACTUALLY accepts, read from its --help rather than
# assumed, and it is load-bearing: a flag a model does not support is refused
# with a message naming the model instead of being passed through to fail deep
# in the backend. They differ for real - boogu and fibo take no LoRA at all.
#   negative     --negative-prompt        lora         --lora PATH [SCALE]
#   prompt-file  --prompt-file            lora-style   mflux's built-in styles
#   dimensions   --width/--height (fxlla's --aspect resolves to these)
#   steps        --steps                  quantize     --quantize
#   seed         --seed                   init-image   --image PATH [STRENGTH]
#   init-image-path   --image-path, the deprecated spelling. Not a synonym: the
#                depth CLI never gained --image, so emitting the new flag there
#                died in argparse, and --image-path cannot carry a strength.
#                Exactly one of the two per model.
#   preset       --preset (ideogram4 only: it defines step count AND guidance)
#   pid-decode   --pid-decode / --pid-degrade-sigma. NVIDIA's pixel-diffusion
#                decoder replaces the VAE decode and emits 4x the requested
#                size, so it is an upscale that happens INSIDE the render. It
#                pulls its own weights (catalog alias `pid`, gated), which is
#                why the consent gate takes it as an extra alias rather than
#                trusting the model's own row.
#
# "Accepts" means the flag DOES something. Ideogram 4's argparse takes --steps
# and --guidance and then warns that both are ignored because its presets fix
# them, so listing those caps let a caller ask for 12 steps, wait eight minutes
# for the preset's 20, and be told nothing. A flag that is accepted and
# discarded is worse than one that is refused.
#
# The same trap, quieter, on the distilled models: mflux declares
# supports_guidance=False for z-image-turbo, boogu, schnell and z-controlnet,
# which pins guidance to 0. And guidance <= 1 makes the sampler DROP the
# negative encoding entirely and skip CFG (mflux z_image.py: `if guidance <=
# 1.0: return text_encodings, None`). So on those models --negative-prompt is
# read, encoded and thrown away without a word. This catalog listed both caps
# on the DEFAULT model, and the media skill recommended negative prompts
# against watermarks and stray text - advice that did nothing there. The real
# fix on a CFG-off model is a different seed.
# Hence the invariant the tests enforce: negative requires guidance or preset.
#
# And a second reason for the same cap, which no invariant here can catch: on
# some families the parameter is simply not implemented. FLUX.1's CLI reads
# --negative-prompt and passes it to generate_image, whose signature accepts it
# and never reads it (mflux flux.py: it appears once, in the signature) - so
# dev, controlnet and depth drop it. Ideogram 4's generate_image has no such
# parameter at all; the shared argparse accepts the flag and nothing carries
# it. Verified per family by reading the backend, which is the part that has to
# stop: the honest fix is for mflux to refuse the flag, or to publish which
# models implement it, so this column can be derived instead of transcribed.
#
# base_model is only needed by the multi-model `mflux-generate` binary.
# An empty steps means the CLI's own default.
# The controlnet and depth entries take an extra input (a control image, a
# depth map) through --control / --depth-image. Models needing a mask or a
# garment (fill, catvton) are still out: those are a different tool shape.

z-image-turbo | mflux-generate-z-image-turbo      |         | 8 | dimensions,init-image,lora,lora-style,pid-decode,prompt-file,quantize,seed,steps                                                    | Default. Fast distilled Z-Image; good general quality in seconds.
z-image       | mflux-generate-z-image            |         |   | dimensions,guidance,init-image,lora,lora-style,negative,pid-decode,prompt-file,quantize,seed,steps                                  | Full Z-Image: slower than the turbo, more detail.
boogu         | mflux-generate-boogu              |         | 8 | dimensions,prompt-file,quantize,seed,steps                                                                                          | Distilled Boogu; stylized, fast.
flux2-klein   | mflux-generate-flux2              |         |   | dimensions,guidance,init-image,lora,lora-style,negative,pid-decode,prompt-file,quantize,seed,steps                                  | FLUX.2 Klein.
qwen          | mflux-generate-qwen               |         |   | dimensions,guidance,init-image,lora,lora-style,negative,pid-decode,prompt-file,quantize,seed,steps                                  | Qwen-Image: strong at text rendering inside images.
qwen-2.1      | mflux-generate-qwen-2.1           |         |   | dimensions,guidance,init-image,lora,negative,prompt-file,quantize,seed,steps                                                        | Qwen-Image 2.1: newer Qwen, text rendering. 40 steps by default, so slow.
ming          | mflux-generate-ming               |         |   | dimensions,guidance,prompt-file,quantize,seed,steps                                                                                 | Ming-Image Design: design layouts, RGBA output. No negative prompt.
krea2         | mflux-generate-krea2              |         |   | dimensions,guidance,init-image,lora,lora-style,negative,pid-decode,prompt-file,quantize,seed,steps                                  | Krea 2: photographic look.
schnell       | mflux-generate                    | schnell | 4 | dimensions,init-image,lora,lora-style,pid-decode,prompt-file,quantize,seed,steps                                                    | FLUX.1 schnell: the classic fast baseline.
dev           | mflux-generate                    | dev     |   | dimensions,guidance,init-image,lora,lora-style,pid-decode,prompt-file,quantize,seed,steps                                           | FLUX.1 dev: slower, higher fidelity.
ideogram4     | mflux-generate-ideogram4          |         |   | dimensions,lora,lora-style,pid-decode,preset,prompt-file,quantize,seed                                                              | Ideogram 4: typography and posters. Takes a JSON caption with bboxes. Cost is the preset, not --steps.
fibo          | mflux-generate-fibo               |         |   | dimensions,guidance,init-image,negative,prompt-file,quantize,seed,steps                                                             | FIBO: long, highly specified prompts.
ernie         | mflux-generate-ernie-image        |         |   | dimensions,guidance,init-image,lora,lora-style,negative,pid-decode,prompt-file,quantize,seed,steps                                  | ERNIE image.
ernie-turbo   | mflux-generate-ernie-image-turbo  |         | 8 | dimensions,init-image,lora,lora-style,pid-decode,prompt-file,quantize,seed,steps                                                    | ERNIE image, distilled.
controlnet    | mflux-generate-controlnet         |         |   | controlnet,controlnet-image,controlnet-strength,dimensions,guidance,lora,lora-style,prompt-file,quantize,seed,steps                 | FLUX + ControlNet. Stack with --control IMAGE[,CHECKPOINT], repeatable.
z-controlnet  | mflux-generate-z-image-controlnet |         | 8 | control-spec,controlnet-strength,dimensions,lora,lora-style,prompt-file,quantize,seed,steps                                         | Z-Image Turbo + ControlNet Union. Stack with --control type:path[:strength].
depth         | mflux-generate-depth              |         |   | depth-image,dimensions,guidance,init-image-path,lora,lora-style,prompt-file,quantize,save-depth,seed,steps                          | Depth-conditioned FLUX. Derives the depth map, or takes one.
