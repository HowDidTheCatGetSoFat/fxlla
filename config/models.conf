embed-qwen3       | Qwen/Qwen3-Embedding-0.6B-GGUF                                      | 0.64GB | embed   | gguf | Multilingual, long context. 1024-dim, 32k context. Use: --quant Q8_0
qwythos           | empero-ai/Qwythos-27B-v1-GGUF                                        | 23.7GB | dev     | gguf | Dense 27B on Qwen3.5, hybrid attention: 262k trained window costs 16 GB of KV where a dense one costs 64. Pull with --quant 27B-MTP-Q6_K - that build carries a multi-token-prediction head and fxlla serves it with self-speculation, measured head to head at a matched 32k window, 31.9 vs 20.6 tok/s on code. Ships a vision projector the 27B card says was never tuned, so it is NOT role vision and gets a description like any other. Reasoning model: give it room or it thinks past its budget. Intentionally uncensored by training. Weights Apache-2.0. The 27B card says it was trained on the same curriculum as this publisher's 9B, whose card describes that curriculum as distilled from Claude traces - so the lineage is stated one model removed, not on this card.
abliterated-27b   | mradermacher/Huihui-Qwen3.5-27B-abliterated-GGUF                     | 23.6GB | redteam | gguf | Qwen3.5-27B with the refusal direction orthogonalized out (Huihui). Same base as qwythos, opposite route: one was trained without alignment, this had it removed. 22.1GB of weights plus both projectors this repo ships (1.6GB) - the row said 22GB while the pull fetched 23.6. Use: --quant Q6_K
qwen3.5-9b        | mradermacher/Qwen3.5-9B-GGUF                                        | 8.9GB  | dev     | gguf | Stock Qwen3.5 at 9B, no fine-tune. Q6_K on purpose: the 4B and 27B builds of this family here are the same publisher at the same quant, so the three sizes differ in size and nothing else - which is what makes an abliterated-versus-base comparison mean anything. The size is 7.4GB of weights plus BOTH projectors this repo ships (f16 and Q8_0, 1.5GB together) - fxlla takes every projector rather than guess which one pairs. Untuned eyes as far as the card says, so NOT role vision. Reasoning model: measured here spending about 7.9k characters of reasoning_content on a one-sentence question, so a tight max_tokens returns an empty answer rather than a short one. Use: --quant Q6_K
gemma-4-12b-qat   | google/gemma-4-12B-it-qat-q4_0-gguf                                 | 7.2GB  | dev     | gguf | Gemma 4 12B, quantization-aware trained rather than quantized afterwards: the 4-bit weights are what it was tuned to end up at, so it loses less than a q4_0 of the same model would. Google's own GGUF build, single quant, no --quant needed. Sized for a 16 GB machine, which is not this one - here it is the small end. Apache-2.0. Google also publishes a QAT build in compressed-tensors (w4a16-ct); that one is for vLLM and llama.cpp cannot read it. Reasoning model, and a quiet one: it spends the budget thinking before it writes, so a short max_tokens returns an empty answer with the whole reply sitting in reasoning_content - give it room. Ships a projector and its own eyes work: with FXLLA_VISION_ROUTING=0, so nothing could answer for it, it read the colour of a shape correctly. Left at role dev anyway - role vision is what the gateway hands an image to when a model that lacks it is asked to read one, and which model gets that job stays a deliberate choice rather than whatever ships a projector.
gemma-4-26b       | mlx-community/gemma-4-26b-a4b-it-4bit                               | 15.4GB | dev     | mlx  | Gemma 4 26B-A4B: a mixture of experts, 26B total but only about 3.9B active per token, so it costs a 26B in RAM and closer to a 4B in arithmetic. MLX 4-bit. Measured here at 119.5 tok/s decode (spread 97.3-134.6), 2657 tok/s prefill, 13.7GB peak RSS - about twice the 12B, which is the MoE arithmetic working out. The better default of the two 26B rows: same eval scores as the QAT build, 38% faster prefill, half the resident memory, a third fewer tokens for the same work. Not text-only in the weights - the index lists 355 vision-tower tensors - but mlx_lm.server refuses image content, so nothing here can hand it one. The QAT sibling is the one whose eyes are reachable, through llama-server. Full table and conditions in docs/BENCHMARKS-local.md.
gemma-4-26b-qat   | google/gemma-4-26B-A4B-it-qat-q4_0-gguf                             | 15.6GB | dev     | gguf | The same 26B-A4B, quantization-aware trained rather than quantized after the fact, from Google. 14.4GB of weights plus a 1.19GB projector, so unlike the 12B QAT row this one is a whole vision model in the download. Single quant, no --quant needed. Measured against the MLX build here: decode is the SAME within noise (106.9 vs 119.5, but the spreads 61.2-122.0 and 97.3-134.6 overlap across most of their range), and it wins TTFT at 102ms vs 192ms. It loses on prefill (1921 vs 2657 tok/s), on memory (29.4 vs 13.7GB peak RSS) and on tokens burned (65.8k vs 49.0k for identical scores). Take this one when the job needs the projector or the lowest TTFT. See docs/BENCHMARKS-local.md.
omlx-coder        | Jundot/Qwen3.6-35B-A3B-oQ4e-mtp                                     | 21.6GB | dev     | omlx | Qwen3.6-35B-A3B (MoE, ~3B active per token, so it costs a 35B in RAM and closer to a 3B in arithmetic) at omlx's oQ4e - a calibration-refined 4-bit whose own model-card table reports beating stock MLX 4-bit at the same file size (83.9 vs 83.0 avg on that card, not measured here). Most-downloaded model in Jundot's catalog. The -mtp head lets omlx self-speculate; mlx_lm would only ignore it. MEASURED here (omlx 0.6.0, clean machine): ~122 tok/s streaming decode, on par with the mlx 26B - and the SSD prefix cache cut TTFT 4.7-8.7x on a reused ~6k prefix (3.6s to 0.8s), surviving a backend restart. WARNING for 'fxlla stats': the gateway counts one token per SSE delta, but omlx packs ~11 tokens per delta, so its passive tok/s reads ~10x low unless the client sends stream_options.include_usage - the real rate is from usage.completion_tokens. Needs the omlx engine (FXLLA_OMLX_BIN).
omlx-27b          | Jundot/Qwen3.6-27B-oQ4e-mtp                                         | 16.7GB | dev     | omlx | Dense Qwen3.6-27B at oQ4e-mtp. Heavier per token than the A3B MoE above (a dense 27B pays for every parameter each token, against ~3B active), so expect slower decode, but a strong single-stream coder; the card's own table shows oQ4e edging plain oQ4 and stock 4-bit at this 16.7GB size (unmeasured here). Same conditions as omlx-coder: served by omlx for its SSD KV cache and the -mtp speculation, unmeasured on this machine, needs the omlx engine.
qwen3.8-27b       | Jundot/Qwen3.8-27B-oQ4e-mtp                                         | 17GB   | dev     | omlx | Dense ~32B (the '27B' name undercounts: 64 layers, hidden 5120) on the Qwen3.5 hybrid-attention arch - 3 linear-attention layers per full one, so a 262k window costs far less KV than a plain dense model (the same trick as qwythos). oQ4e imatrix 4-bit with selective 5-bit on the critical projections. MTP head for omlx self-speculation. A VLM in the weights but served text-only here. MEASURED here (omlx 0.6.0): 31 tok/s decode (dense 32B, against 122 for the A3B omlx-coder), SSD cache 6.2x on TTFT (5.2s to 0.8s), 17GB RSS - a real 17GB resident, not the MoE's mmap undercount. Usable single-stream; slower than the MoE, trading speed for dense per-token quality and a cheap 262k window. Needs the omlx engine.
