# Model catalog. Format:
#   alias | hf_repo | approx size | role | engine | note
#
# engine: mlx (default), gguf, omlx, or mtplx.
# `mtplx` models are served by MTPLX (a fourth OPTIONAL engine): native MTP
# speculative decoding with no external drafter, also with an SSD session cache.
# Measured faster than omlx on the same model class (see the mtplx- rows). Its
# models come from a different quantizer (Youssofal) and ship an mtplx_runtime
# contract file. `fxlla on` refuses clearly when mtplx is not installed.
# `omlx` models are served by the omlx inference server (an OPTIONAL third
# engine, see `fxlla doctor`): continuous batching plus a two-tier KV cache
# (RAM + SSD) that survives a restart, so a reused prompt prefix is restored
# from disk instead of a 60-80s recompute. omlx also uses a model's -mtp head
# for self-speculative decoding, which mlx_lm ignores. These weights are plain
# MLX affine quant on disk, but they are catalogued as omlx because that is the
# engine that pays off here; `fxlla on <alias>` refuses with a clear error when
# omlx is not installed.
# `fxlla pull <alias>` uses this line. `fxlla pull <org/repo> [--gguf] [--quant X]`
# also works with any Hugging Face repository. A repo that keeps the model in a
# SUBFOLDER (several quants under mlx-8bit/, mlx-4bit/, ... beside a big root
# copy) can be pulled by naming the subfolder - `fxlla pull <org/repo/subdir>`,
# or put that path in column 2 here - and only that subtree is fetched, then
# flattened so config.json lands at the model-dir root.
# Sizes are approximate download sizes (decimal GB), and they mean EVERYTHING
# the pull fetches, not the weights file. A vision repo ships one or more
# multimodal projectors and the pull takes every one, so a row written from the
# weights alone runs under - `abliterated-27b` said 22GB and fetched 23.6. This
# number is what an agent quotes to a user before a download, so it is the one
# they consent against.
#
# role 'embed' models feed `fxlla kb`. Pick one with FXLLA_EMBED_MODEL; it
# defaults to 'embed'. The dimension in each note is read from the GGUF itself,
# and it decides compatibility: a knowledge base built at one width cannot be
# searched at another, so switching models means `fxlla kb reindex <name>`.
# Pooling is not configured anywhere because every one of these declares its own
# pooling_type and llama.cpp honours it.
#
# role 'vision' is a claim about quality, not about hardware, and the gateway
# treats it as one. It means the eyes were meant to be used: a model with this
# role and a projector on disk is handed images untouched, and is eligible to
# read them on another model's behalf. Leaving it off is the safe default, so a
# model that inherited a vision tower from its base and never tuned it belongs
# under whatever it is actually good at - it will still be given a description
# rather than trusted with the image. Measure before granting this.

