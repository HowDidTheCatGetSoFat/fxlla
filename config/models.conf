# and mlx-4bit/ subfolders until 2026-08-24, when the owner reorganized the repo
# (now GGUF + safetensors at the root, no MLX subfolders). The two models pulled
# from those subfolders are still on disk as oblit-8bit / oblit-4bit (measured:
# 4-bit 34 tok/s, 8-bit 19 tok/s, MTP head survives the abliteration) and the
# gateway serves them, but they are NOT catalogued here because the subfolder
# path they came from no longer exists - a pull would fail. The subfolder-pull
# support (owner/name/subdir, see _repo_subdir) stays for repos that still use it.
mtplx-qwen38      | Youssofal/Qwen3.8-27B-MTPLX-Optimized-Speed                         | 21.3GB | dev     | mtplx | The same Qwen3.8-27B, but Youssofal's MTPLX-Optimized-Speed build served by the MTPLX engine (native MTP speculative decode). MEASURED here: 49 tok/s decode - about 1.6x the omlx build above (31) on the same model, and 2x MTPLX's own stock-AR baseline (25), so the MTP head is doing real work. Ships an mtplx_runtime contract file in the repo, so a normal pull serves it verified. Has its own SSD session cache too. Needs the mtplx engine (FXLLA_MTPLX_BIN); the fastest single-stream option in this catalog for a dense 27B.
